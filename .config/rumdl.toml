# rumdl configuration file for kompend

[global]
# Maximum allowed line length (kompend docs have long URLs and tables)
line-length = 320

# Markdown flavor/dialect: kompend targets Obsidian by default
flavor = "obsidian"

# MD013 (line length) is disabled globally: `line-length` above already allows
# long URLs and tables, and the remaining long lines are in generated or
# agent-only files where wrapping buys nothing.
disable = ["MD013"]