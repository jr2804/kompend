# mise configuration
# Task definitions are in conf.d/*.toml files (automatically loaded by mise)
[tools]
# basic frameworks that should always be available
#node = "latest"
bun = "latest"

# Linter/formatter/type checker tools
"ruff" = "latest"
"ty" = "latest"
"rumdl" = "latest"
"pypi:pyreorder" = "latest"
"pypi:codespell" = "latest"
# Static checker for .github/workflows/*.yml. The fork, not rhysd/actionlint:
# same rules, newer line (2.x vs 1.7.x) and actively released.
"github:jdx/jactionlint" = "latest"
# jactionlint shells out to shellcheck for the `run:` blocks; without it on PATH
# it skips every script in the workflows.
shellcheck = "latest"

# CLI tools rg and tree-cli -> use `rg --files | tree-cli --fromfile` to get a nice tree view of the project files
ripgrep = "latest"
"github:peteretelej/tree" = { version = "latest", rename_exe = "tree-cli" }
"npm:@jkudish/jev-mcp" = "latest"

"npm:@colbymchenry/codegraph" = "latest"
"github:1broseidon/ketch" = "latest"

"github:gastownhall/beads" = "latest"
"github:dolthub/dolt" = "latest"
"pypi:beads-mcp" = "latest"

[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true
