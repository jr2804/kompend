[project]
name = "knox"
dynamic = ["version"]
description = "Knowledge Organizer for eXtended documents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan Reimes", email = "jan@reimes.de" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup",
    "Topic :: Database :: Front-Ends",
]
keywords = [
    "knowledge-base",
    "wiki",
    "llm",
    "rag",
    "document-processing",
    "open-knowledge-format",
    "okf",
    "mcp",
    "acp",
    "knowledge-management",
    "semantic-search",
    "vector-search",
    "pdf-parsing",
    "knowledge-graph",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "jinja2>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "chonkie>=1.0.0",
    "crawl4ai[all]>=0.5.0",
    "zvec>=0.4.0",
    "rumdl>=0.2.9",
    "fastmcp-slim[server]>=4.0.0",
    "pydantic>=2.13.4",
    "wenmode>=0.14.1",
    "pydantic-ai[sentence-transformers]>=2.8.0",
    "pydantic-ai-rlm>=0.1.2",
    "python-slugify[unidecode]>=8.0.4",
    "tomli-w>=1.2.0",
    "pyyaml>=6.0",
    "binaryornot>=0.6.0",
    "datasketch>=1.10.0",
    "mail-parser>=4.4.0",
    "toon-format>=0.9.0b1",
    "ison-py>=1.0.2",
    "pydantic-settings>=2.14.2",
    "py7zr>=1.1.3",
    "unrar2-cffi>=0.5.0",
    "json-repair[schema]>=0.61.2",
    "tenacity>=9.0.0",
    "logfire[system-metrics]>=4.37.0",
    "pydantic-ai-harness[acp]>=0.7.0",
    "models-dev>=1.0.398",
    "ollama>=0.6.2",
    "summarization-pydantic-ai>=0.1.10",
    "aenum>=3.1.17",
    "lazy-loader",
    "rapidfuzz>=3.14.6",
    "charset-normalizer>=3.5.1",
]

[project.scripts]
knox = "knox.cli.app:main"

[project.optional-dependencies]

# External document-intelligence pipeline (parsecraft adapter). The ingestion
# path: it drives docling, liteparse, pandoc, trafilatura, its native backends
# and its OCR backends internally, so those are never knox dependencies — they
# arrive transitively through this extra.
#
# Names track parsecraft 2026.10.3, which restructured its extras: `trafilatura`
# became `web` (same engine — httpx + trafilatura), and `pdf-lite` is gone with
# `pdf` in its slot. `pdf` is PyMuPDF, AGPL-3.0-or-commercial — NOT the pypdf
# that `pdf-lite` was — so naming it would add an AGPL obligation inside a
# rename. It is deliberately omitted and costs nothing knox uses: in 2026.10.3
# `native-pdf` declares no optional group, so it is base-install and needs no
# extra, and the `trafilatura` backend is satisfied by `web`. Name `pdf` only if
# some future parsecraft backend actually gates on it.
#
# WARNING: uv SILENTLY IGNORES an unknown extra — a stale name here installs
# nothing rather than failing, which is how `systemone`, `pdf-lite` and
# `trafilatura` became no-ops after the 2026.10.3 upgrade. Re-check parsecraft's
# `Provides-Extra` list whenever the parsecraft floor moves.
parsecraft = [
    "parsecraft[liteparse,docling,pandoc,web]>=2026.10.1",
]

#: Judge-tier routing (`[ingest] parsecraft_judge` / `parsecraft_preference`).
#: parsecraft 2026.10.3 removed its own `systemone` extra and moved the SDK into
#: `auto`. It is needed for **every** judge provider, not just the cloud ones:
#: `parsecraft/providers/_jev.py` imports `typesafe_sdk` for `ollama`, `zen` and
#: `typesafe-ai` alike ("all three endpoints share it"), and raises
#: `JudgeProviderUnavailableError: judge provider 'ollama' unavailable` without
#: it. So a locally-run Jev model needs this extra exactly as much as a hosted
#: one does.
#:
#: `parsecraft[auto]` rather than a bare `typesafe-sdk` pin deliberately: parsecraft
#: owns that floor, and duplicating it here would let the two drift. The extra also
#: carries `pdf-inspector`, which knox does not use directly — accepted as the cost
#: of not re-declaring another project's dependency.
#:
#: No knox extra is needed for `judge = "none"` (the default), which is why this
#: is separate from the main `parsecraft` extra rather than folded into it.
systemone = [
    "parsecraft[auto]>=2026.10.1",
]

#: parsecraft[mineru] installs the MinerU 4.x stack: code under the MinerU Open
#: Source License (Apache-2.0 PLUS commercial-use thresholds >100M MAU /
#: >USD 20M revenue, attribution duty, termination-without-notice); the default
#: VLM checkpoint weights are Apache-2.0; the Windows-default llama.cpp GGUF
#: engine and the ONNX kit are licence-undeclared upstream. Installing the extra
#: is the opt-in (ADR-0007). Weights are downloaded by MinerU itself at first
#: conversion — parsecraft never fetches them.
mineru = [
    "parsecraft[mineru]>=2026.10.2",
]

otel = [
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
]

# marker-pdf is parsecraft's bring-your-own dependency (ADR-0006): the marker
# backend detects a manual install by import. No release can be locked here —
# 1.x pins anthropic<0.47 against pydantic-ai's >=0.108, and 2.0.0 resolves
# only by downgrading anthropic and pillow graph-wide. Manual install only:
#   uv pip install marker-pdf


[dependency-groups]

dev = [
    "logfire[system-metrics]>=4.41.0",
    "mkdocs-material>=9.7.6",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "uv-dynamic-versioning>=0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knox"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
pattern = "default-unprefixed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "benchmark: Quality benchmarks that report metrics rather than assert pass/fail.",
    "asyncio: mark test as async",
    "integration: Tests that require real files or network access.",
]

[tool.pytest-cov]
addopts = "--cov=knox --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 50

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"
