[project]
name = "knox"
dynamic = ["version"]
description = "Knowledge Organizer for eXtended documents"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.13"
authors = [
    { name = "Jan Reimes", email = "jan@reimes.de" }
]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12.0",
    "docling-slim[format-pdf,format-office,cli,convert-core,extract-core]>=2.97.0",
    "chonkie>=1.0.0",
    "crawl4ai>=0.5.0",
    "pdfplumber>=0.11.0",
]

[project.scripts]
knox = "knox.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knox"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"
markers = [
    "benchmark: Quality benchmarks that report metrics rather than assert pass/fail.",
]

[tool.pytest-cov]
addopts = "--cov=knox --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 100

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"

[tool.undersort]
# Method visibility ordering: public (no underscore), protected (single underscore), private (double underscore)
order = ["public", "protected", "private"]
# Method type ordering within each visibility level
method_type_order = ["instance", "class", "static"]