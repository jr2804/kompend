[project]
name = "kompend"
dynamic = ["version"]
description = "Compile a document corpus into an interlinked, OKF-conformant markdown wiki"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan Reimes", email = "jan@reimes.de" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup",
    "Topic :: Database :: Front-Ends",
]
keywords = [
    "knowledge-base",
    "wiki",
    "llm",
    "rag",
    "document-processing",
    "open-knowledge-format",
    "okf",
    "mcp",
    "acp",
    "knowledge-management",
    "semantic-search",
    "vector-search",
    "pdf-parsing",
    "knowledge-graph",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "jinja2>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "chonkie>=1.0.0",
    "crawl4ai[all]>=0.5.0",
    "zvec>=0.4.0",
    "rumdl>=0.2.9",
    "fastmcp-slim[server]>=4.0.0",
    "pydantic>=2.13.4",
    "wenmode>=0.14.1",
    "pydantic-ai[sentence-transformers]>=2.8.0",
    "pydantic-ai-rlm>=0.1.2",
    "python-slugify[unidecode]>=8.0.4",
    "tomli-w>=1.2.0",
    "pyyaml>=6.0",
    "binaryornot>=0.6.0",
    "datasketch>=1.10.0",
    "mail-parser>=4.4.0",
    "toon-format>=0.9.0b1",
    "ison-py>=1.0.2",
    "pydantic-settings>=2.14.2",
    "py7zr>=1.1.3",
    "unrar2-cffi>=0.5.0",
    "json-repair[schema]>=0.61.2",
    "tenacity>=9.0.0",
    "logfire[system-metrics]>=4.37.0",
    "pydantic-ai-harness[acp]>=0.7.0",
    "models-dev>=1.0.398",
    "ollama>=0.6.2",
    "summarization-pydantic-ai>=0.1.10",
    "aenum>=3.1.17",
    "lazy-loader",
    "rapidfuzz>=3.14.6",
    "charset-normalizer>=3.5.1",
]

[project.scripts]
kompend = "kompend.cli.app:main"

[project.optional-dependencies]

# parsecraft drives docling, liteparse, pandoc, trafilatura, its builtin and OCR
# backends internally; the extras bring the ones that are not base-install. `pdf` is
# omitted deliberately — PyMuPDF is AGPL-3.0-or-commercial. uv ignores an unknown extra
# silently, so re-check parsecraft's extras whenever the floor moves.
#
# Floor is 2026.10.5, and it is load-bearing: that release moved `auto`, `liteparse`,
# `pandoc` and `openpyxl` into the BASE install. Below it, naming only `[docling,web]`
# would not bring liteparse or pandoc at all and the routing would silently lose both.
parsecraft = [
    "parsecraft[docling,web]>=2026.10.5",
]

# The judge tier (`[ingest] parsecraft_judge`) needs no extra. `typesafe-sdk` — shared
# by the ollama, zen and typesafe-ai providers alike — is base-install from 2026.10.5,
# as is the OCR-need classifier. The `systemone` extra that used to provide the SDK is
# deliberately deleted rather than repointed: a knox extra wrapping one upstream extra
# is a name to keep in sync forever for no benefit, and it silently became a no-op the
# moment upstream moved the payload.

# MinerU 4.x licence opt-in (ADR-0007): code is Apache-2.0 plus commercial-use
# thresholds (>100M MAU / >USD 20M revenue), an attribution duty and termination
# without notice; weights are Apache-2.0; the Windows-default GGUF engine and the
# ONNX kit are licence-undeclared upstream. MinerU fetches weights at first use.
mineru = [
    "parsecraft[mineru]>=2026.10.2",
]

otel = [
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
]

# marker-pdf is bring-your-own (ADR-0006): the backend detects a manual install by
# import. No extra can be locked — 1.x pins anthropic<0.47 against pydantic-ai's
# >=0.108, and 2.0.0 resolves only by downgrading anthropic and pillow graph-wide.
# Manual only: uv pip install marker-pdf


[dependency-groups]

dev = [
    "logfire[system-metrics]>=4.41.0",
    "mkdocs-material>=9.7.6",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "uv-dynamic-versioning>=0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kompend"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
pattern = "default-unprefixed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "benchmark: Quality benchmarks that report metrics rather than assert pass/fail.",
    "asyncio: mark test as async",
    "integration: Tests that require real files or network access.",
]

[tool.pytest-cov]
addopts = "--cov=kompend --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 50

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"
