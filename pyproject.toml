[project]
name = "kompend"
dynamic = ["version"]
description = "Compile a document corpus into an interlinked, OKF-conformant markdown wiki"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan Reimes", email = "github@jan-reimes.de" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup",
    "Topic :: Database :: Front-Ends",
]
keywords = [
    "knowledge-base",
    "wiki",
    "llm",
    "rag",
    "document-processing",
    "open-knowledge-format",
    "okf",
    "mcp",
    "acp",
    "knowledge-management",
    "semantic-search",
    "vector-search",
    "pdf-parsing",
    "knowledge-graph",
]
dependencies = [
    "typer>=0.26.8",
    "rich>=15.0.0",
    "jinja2>=3.1.6",
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
    "chonkie>=1.7.0",
    "crawl4ai[all]>=0.9.5",
    "zvec>=0.7.0",
    "rumdl>=0.2.79",
    "fastmcp-slim[server]>=4.1.0",
    "pydantic>=2.14.1",
    "wenmode>=0.15.2",
    "pydantic-ai[sentence-transformers]>=2.31.1",
    "pydantic-ai-rlm>=0.1.2",
    "python-slugify[unidecode]>=9.1.3",
    "tomli-w>=1.2.0",
    "pyyaml>=6.0.3",
    "binaryornot>=0.6.0",
    "datasketch>=2.0.0",
    "mail-parser>=4.8.0",
    "toon-format>=1.1.0",
    "ison-py>=1.2.0",
    "pydantic-settings>=2.16.0",
    "py7zr>=1.1.4",
    "unrar2-cffi>=0.5.0",
    "json-repair[schema]>=0.64.0",
    "tenacity>=9.1.4",
    "logfire[system-metrics]>=5.2.0",
    "pydantic-ai-harness[acp]>=0.24.0",
    "models-dev>=1.0.398",
    "ollama>=0.6.3",
    "summarization-pydantic-ai>=0.1.11",
    "aenum>=3.1.17",
    "lazy-loader",
    "rapidfuzz>=3.14.6",
    "charset-normalizer>=3.5.2",
    "parsecraft[docling,web]>=2026.10.12",
]

[project.scripts]
kompend = "kompend.cli.app:main"

[project.optional-dependencies]

# Only heavy ML OCR models and licence-gated backends (pymupdf, mineru) stay opt-in.
ocr = ["parsecraft[ocr]>=2026.10.12"]
mineru = ["parsecraft[mineru]>=2026.10.12"]
pymupdf = ["parsecraft[pymupdf]>=2026.10.12"]
pdf-full = ["parsecraft[pdf-full]>=2026.10.12"]  # pymupdf + mineru

# marker-pdf is bring-your-own: uv pip install marker-pdf
otel = [
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp>=1.45.1",
]


[dependency-groups]

dev = [
    "logfire[system-metrics]>=5.2.0",
    "mkdocs-material>=9.7.7",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "uv-dynamic-versioning>=0.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kompend"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
pattern = "default-unprefixed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "benchmark: Quality benchmarks that report metrics rather than assert pass/fail.",
    "asyncio: mark test as async",
    "integration: Tests that require real files or network access.",
]

[tool.pytest-cov]
addopts = "--cov=kompend --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 50

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"
