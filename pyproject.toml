[project]
name = "knox"
dynamic = ["version"]
description = "Knowledge Organizer for eXtended documents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Jan Reimes", email = "jan@reimes.de" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup",
    "Topic :: Database :: Front-Ends",
]
keywords = [
    "knowledge-base",
    "wiki",
    "llm",
    "rag",
    "document-processing",
    "open-knowledge-format",
    "okf",
    "mcp",
    "acp",
    "knowledge-management",
    "semantic-search",
    "vector-search",
    "pdf-parsing",
    "knowledge-graph",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "jinja2>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "chonkie>=1.0.0",
    "crawl4ai[all]>=0.5.0",
    "zvec>=0.4.0",
    "rumdl>=0.2.9",
    "fastmcp-slim[server]>=4.0.0",
    "pydantic>=2.13.4",
    "wenmode>=0.14.1",
    "pydantic-ai[sentence-transformers]>=2.8.0",
    "pydantic-ai-rlm>=0.1.2",
    "python-slugify[unidecode]>=8.0.4",
    "tomli-w>=1.2.0",
    "pyyaml>=6.0",
    "binaryornot>=0.6.0",
    "datasketch>=1.10.0",
    "mail-parser>=4.4.0",
    "toon-format>=0.9.0b1",
    "ison-py>=1.0.2",
    "pydantic-settings>=2.14.2",
    "py7zr>=1.1.3",
    "unrar2-cffi>=0.5.0",
    "json-repair[schema]>=0.61.2",
    "tenacity>=9.0.0",
    "logfire[system-metrics]>=4.37.0",
    "pydantic-ai-harness[acp]>=0.7.0",
    "models-dev>=1.0.398",
    "ollama>=0.6.2",
    "summarization-pydantic-ai>=0.1.10",
    "aenum>=3.1.17",
    "lazy-loader",
    "liteparse>=2.4.0,<2.13",  # 2.13.0 shipped no cp313+ wheels and no sdist; relax when fixed
    "trafilatura>=2.0.0",
    "rapidfuzz>=3.14.6",
    "charset-normalizer>=3.5.1",
]

[project.scripts]
knox = "knox.cli.app:main"

[project.optional-dependencies]

docling = [
    "docling-slim[format-pdf,format-office,cli,convert-core,extract-core,format-markdown,feat-ocr-rapidocr]>=2.97.0",
    "docling-ibm-models>=3.13.3",
    "pypdfium2>=5.10.1",
    "opencv-python-headless>=4.13.0.92",
    "onnxruntime>=1.26.0",
    # OCR engine for scanned PDFs. Without one, docling's ``do_ocr`` silently
    # raises "No OCR engine found" and scanned pages yield no text. rapidocr
    # is the only OCR extra in docling-slim that needs no system Tesseract
    # install (feat-ocr-rapidocr, selected above).
    #
    # Formula/code enrichment loads CodeFormulaV2 through transformers with a
    # device_map, which hard-requires accelerate. Without it every PDF parse
    # raises once pdf.formula_enrichment/pdf.code_enrichment are on (both
    # default on).
    "accelerate>=1.0.0",
]

pandoc = [
    "pypandoc[tinytex]>=1.17",
]

otel = [
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
]

# The original plan was to offer further advanced parser backends as optional dependencies,
# but they conflict on transitive dependencies (pillow, transformers, etc.) and
# cannot be locked. So for now, we just provide a single default parser
# backend (liteparse) and let users install alternatives manually if needed.
#
# Implemented options are:
# - marker-pdf
# - glmocr
# - mineru (conflict on pillow, marker needs <11, glmocr needs >=12).
#
# Manually if needed:
#   uv pip install marker-pdf   # or glmocr, mineru


[dependency-groups]

dev = [
    "logfire[system-metrics]>=4.41.0",
    "mkdocs-material>=9.7.6",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "uv-dynamic-versioning>=0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knox"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
pattern = "default-unprefixed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "benchmark: Quality benchmarks that report metrics rather than assert pass/fail.",
    "asyncio: mark test as async",
    "integration: Tests that require real files or network access.",
]

[tool.pytest-cov]
addopts = "--cov=knox --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 50

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"
