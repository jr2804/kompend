[project]
name = "kompend"
dynamic = ["version"]
description = "Compile a document corpus into an interlinked, OKF-conformant markdown wiki"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan Reimes", email = "github@jan-reimes.de" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup",
    "Topic :: Database :: Front-Ends",
]
keywords = [
    "knowledge-base",
    "wiki",
    "llm",
    "rag",
    "document-processing",
    "open-knowledge-format",
    "okf",
    "mcp",
    "acp",
    "knowledge-management",
    "semantic-search",
    "vector-search",
    "pdf-parsing",
    "knowledge-graph",
]
dependencies = [
    # docling (base dependency, via parsecraft[docling]) caps typer at <0.27 for
    # every release up to 2.142.1, so the floor has to stay below that ceiling.
    # src/kompend/cli/_group.py uses typer.core.TyperCommand/TyperGroup and
    # typer.main.get_command_from_info, whose signatures are unchanged in 0.26.
    "typer>=0.19,<0.27",
    "rich>=15.0.0",
    "jinja2>=3.1.6",
    "fastapi>=0.161.1",
    "uvicorn>=0.54.0",
    "chonkie>=1.7.0",
    "crawl4ai[all]>=0.9.5",
    "zvec>=0.8.0",
    "rumdl>=0.3.0",
    "fastmcp-slim[server]>=4.1.3",
    "pydantic>=2.14.1",
    "wenmode>=0.15.3",
    "pydantic-ai-slim[openai,google,anthropic,groq,mistral,cohere,xai,openrouter,zai,typesafe,huggingface,voyageai,web-fetch,duckduckgo,cli,mcp,mcp-tasks]>=2.60.0",
    "pydantic-ai-rlm>=0.1.2",
    "python-slugify[unidecode]>=9.1.3",
    "tomli-w>=1.2.0",
    "pyyaml>=6.0.3",
    "binaryornot>=0.6.0",
    "datasketch>=2.0.0",
    "mail-parser>=4.8.0",
    "toon-format>=1.2.0",
    "ison-py>=1.2.0",
    "pydantic-settings>=2.16.1",
    "py7zr>=1.1.4",
    "unrar2-cffi>=0.5.0",
    "json-repair[schema]>=0.64.2",
    # latest 9.2.x is blocked by google-genai's tenacity<9.2.0 (upstream pin)
    "tenacity>=9.1.4",
    "logfire[system-metrics]>=5.2.0",
    "pydantic-ai-harness[acp]>=0.60.0",
    "ollama>=0.6.3",
    "aenum>=3.1.17",
    "lazy-loader>=0.6",
    "rapidfuzz>=3.14.6",
    "charset-normalizer>=3.5.2",
    "parsecraft[docling,web]>=2026.10.12",
    "llmdb>=1.0.0",
]

[project.scripts]
kompend = "kompend.cli.launch:main"

[project.optional-dependencies]

# Only heavy ML OCR models and licence-gated backends (pymupdf, mineru) stay opt-in.
ocr = ["parsecraft[ocr]>=2026.10.12"]
# MinerU 4.x caps openai at <3 while pydantic-ai-slim >=2.60 needs openai>=3.26,
# so this extra cannot resolve next to the model stack. It is kept for the
# pinned-override workflow (the repo's own [tool.uv] overrides) only.
mineru = ["parsecraft[mineru]>=2026.10.12"]
pymupdf = ["parsecraft[pymupdf]>=2026.10.12"]
# docling is already a base dependency; pdf-full adds the licensed pymupdf
# backend and stays free of mineru (see the openai note above).
pdf-full = [
    "parsecraft[pymupdf]>=2026.10.12",
    "parsecraft[docling]>=2026.10.12",
]

# marker-pdf is bring-your-own: uv add marker-pdf
otel = [
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp>=1.45.1",
]


[dependency-groups]

dev = [
    "logfire[system-metrics]>=5.2.0",
    "pydantic-ai-slim[logfire]>=2.60.0",
    "mkdocs-material>=9.7.7",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "uv-dynamic-versioning>=0.14.1",
]

[tool.uv]
# MinerU (<=4.0.12) caps openai at <3 while pydantic-ai-slim >=2.60 needs
# openai>=3.26.0. Only the mineru extra hits that, and this override keeps
# the repository's own environment (and its tests) on one model stack. A
# PyPI install must not use [mineru] until MinerU lifts the cap.
override-dependencies = ["openai>=3.26.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/kompend"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"
pattern = "default-unprefixed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "benchmark: Quality benchmarks that report metrics rather than assert pass/fail.",
    "asyncio: mark test as async",
    "integration: Tests that require real files or network access.",
]

[tool.pytest-cov]
addopts = "--cov=kompend --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 50

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"
