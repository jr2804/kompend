[project]
name = "knox"
dynamic = ["version"]
description = "Knowledge Organizer for eXtended documents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Jan Reimes", email = "jan@reimes.de" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "jinja2>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "docling-slim[format-pdf,format-office,cli,convert-core,extract-core,format-markdown]>=2.97.0",
    "chonkie>=1.0.0",
    "crawl4ai>=0.5.0",
    "litellm>=1.0.0",
    "pdfplumber>=0.11.0",
    "zvec>=0.4.0",
    "mail-parser>0",
    "marko>0",
    "pylatexenc>0",
    "sentence-transformers>=5.5.1",
    "pillow>=12.2.0",
    "docling-ibm-models>=3.13.3",
    "opencv-python-headless>=4.13.0.92",
    "rumdl>=0.2.9",
    "mcp>=1.27.2",
    "pandoc>=2.4",
    "pydantic>=2.13.4",
    "python-slugify[unidecode]>=8.0.4",
    "opendataloader-pdf[all,hybrid]>=2.4.7",
]

[project.scripts]
knox = "knox.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "zensical>0.0.44",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knox"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "benchmark: Quality benchmarks that report metrics rather than assert pass/fail.",
    "asyncio: mark test as async",
    "integration: Tests that require real files or network access.",
]

[tool.pytest-cov]
addopts = "--cov=knox --cov-report=term-missing --cov-report=html --cov-report=xml"
fail_under = 50

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"

[tool.undersort]
# Method visibility ordering: public (no underscore), protected (single underscore), private (double underscore)
order = ["public", "protected", "private"]
# Method type ordering within each visibility level
method_type_order = ["instance", "class", "static"]
