# Auto-tag and release every push to main.
#
# Creates a calendar version tag (YYYY.M.D / YYYY.M.D.N) and publishes
# a Forgejo release with the built wheel + sdist + LLM-generated release notes.
#
# Prerequisites:
#   1. Repo Settings -> Units -> enable "Actions"
#   2. Select a runner label (codeberg-small is recommended)
#   3. Set MISTRAL_API_KEY secret:
#      fj actions secrets create MISTRAL_API_KEY "<your-key>"
#
# https://forgejo.codeberg.page/docs/next/user/actions/

name: Tag and Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: codeberg-small
    timeout-minutes: 10

    steps:
      # --- Checkout with full history so we can inspect tags ---
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Compute next calver version ---
      #   First push today  ->  YYYY.M.D
      #   Subsequent pushes ->  YYYY.M.D.N  (N = 1, 2, 3...)
      - name: Compute next version
        id: version
        run: |
          today=$(date +%Y.%-m.%-d)

          max_suffix=$(
            git tag -l "${today}.*" \
              | sed "s/^${today}\.//" \
              | sort -n \
              | tail -1
          )

          if [ -z "$max_suffix" ]; then
            if git tag -l "${today}" | grep -q .; then
              echo "version=${today}.1" >> "$GITHUB_OUTPUT"
            else
              echo "version=${today}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "version=${today}.$((max_suffix + 1))" >> "$GITHUB_OUTPUT"
          fi

          echo "Computed: $(grep ^version= "$GITHUB_OUTPUT" | cut -d= -f2)"

      # --- Install system tooling ---
      - name: Install system deps
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            curl ca-certificates jq
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --- Create and push the tag ---
      - name: Create and push tag
        run: |
          git config user.name  "knox-release-bot"
          git config user.email "bot@knox.local"

          owner="${{ github.repository_owner }}"
          repo="${{ github.repository }}"
          ver="${{ steps.version.outputs.version }}"

          git remote set-url origin \
            "https://${owner}:${FORGEJO_TOKEN}@codeberg.org/${repo}.git"

          git tag -a "$ver" -m "Release $ver"
          git push origin "$ver"

      # --- Build wheel + sdist ---
      - name: Build
        run: |
          "$HOME/.local/bin/uv" build

      # --- Generate release notes via LLM ---
      # Uses Codestral (or Mistral) API. Falls back to raw git log if the
      # API call fails or no secret is configured.
      - name: Generate release notes
        id: notes
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          ver="${{ steps.version.outputs.version }}"

          # Collect git log since last tag (or last 10 commits if first release)
          last_tag=$(git tag -l --sort=-version:refname | head -2 | tail -1 || echo "")
          if [ -n "$last_tag" ]; then
            log=$(git log --oneline --no-decorate "${last_tag}..HEAD")
          else
            log=$(git log --oneline --no-decorate -10)
          fi

          # Fallback: raw git log with markdown formatting
          fallback=$(printf '## KNOX %s\n\n### Changes since previous release\n\n```\n%s\n```' "$ver" "$log")

          # Try LLM if API key is available
          notes=""
          if [ -n "$MISTRAL_API_KEY" ]; then
            echo "Generating release notes via Codestral ..."

            prompt=$(printf 'You generate concise, well-structured release notes from git commit logs. Follow these rules:\n- Group changes under headings: Features, Fixes, Maintenance, Documentation\n- Use bullet points with the scope prefix in parentheses, e.g. (parsers), (cli)\n- Be factual and precise. Do not add fluff or praise.\n- Output pure markdown, starting with "## KNOX %s" as the main heading.\n\nCommits:\n%s' "$ver" "$log")

            response=$(curl -s https://api.mistral.ai/v1/chat/completions \
              -H "Authorization: Bearer ${MISTRAL_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg prompt "$prompt" \
                '{
                  model: "mistral-small-latest",
                  messages: [
                    {role: "system", content: "You are a release notes generator. Output pure markdown, no extra commentary."},
                    {role: "user", content: $prompt}
                  ],
                  max_tokens: 800,
                  temperature: 0.3
                }'
              )")

            notes=$(echo "$response" | jq -r '.choices[0].message.content // empty')

            if [ -z "$notes" ]; then
              echo "LLM returned empty response, using fallback"
              echo "$response" | jq -c '.error // .' 2>/dev/null || true
            fi
          else
            echo "MISTRAL_API_KEY not set, using git log fallback"
          fi

          # Use LLM output or fallback
          body="${notes:-$fallback}"

          # Write to temp file for the next step (avoids YAML multiline issues)
          echo "$body" > /tmp/release-body.md

      # --- Create Forgejo release and attach build artifacts ---
      - name: Create release
        run: |
          owner="${{ github.repository_owner }}"
          repo="${{ github.repository }}"
          ver="${{ steps.version.outputs.version }}"
          body=$(cat /tmp/release-body.md)

          # Create the release via Forgejo API
          response=$(curl -s -X POST \
            "https://codeberg.org/api/v1/repos/${repo}/releases" \
            -H "Authorization: Bearer ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg tag "$ver" \
              --arg name "$ver" \
              --arg body "$body" \
              '{tag_name: $tag, name: $name, body: $body, prerelease: false}'
            )")

          release_id=$(echo "$response" | jq -r '.id // empty')
          if [ -z "$release_id" ]; then
            echo "ERROR: Release creation failed:"
            echo "$response" | jq .
            exit 1
          fi
          echo "Release created: id=${release_id}"

          # Upload wheel
          for artifact in dist/knox-*.whl; do
            [ -f "$artifact" ] || continue
            echo "Uploading ${artifact} ..."
            curl -s -X POST \
              "https://codeberg.org/api/v1/repos/${repo}/releases/${release_id}/assets" \
              -H "Authorization: Bearer ${FORGEJO_TOKEN}" \
              -F "attachment=@${artifact}" > /dev/null
          done

          # Upload sdist
          for artifact in dist/knox-*.tar.gz; do
            [ -f "$artifact" ] || continue
            echo "Uploading ${artifact} ..."
            curl -s -X POST \
              "https://codeberg.org/api/v1/repos/${repo}/releases/${release_id}/assets" \
              -H "Authorization: Bearer ${FORGEJO_TOKEN}" \
              -F "attachment=@${artifact}" > /dev/null
          done

          echo "Release published: https://codeberg.org/${repo}/releases/tag/${ver}"
