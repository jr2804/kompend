# Build the mkdocs site and deploy to GitHub Pages.
#
# Triggers on every push to main (mirrors the release cadence) and on manual
# dispatch for ad-hoc rebuilds.
#
# Prerequisites (one-time setup, done by the repository owner on GitHub):
#   1. Enable GitHub Pages from "GitHub Actions" source (Settings -> Pages).
#      The site will then be served at https://jr2804.github.io/kompend/.
#   2. The repo must contain `docs/` and `mkdocs.yml` at the root (owned by
#      knox-2; not this workflow's concern). If either is missing, the build
#      step fails and no deploy happens.
#
# Assumptions:
#   - Python 3.13 (matches pyproject's requires-python).
#   - The mkdocs install set is `mkdocs` + `mkdocs-material`. If the project
#     actually uses a different theme plugin or material-for-mkdocs extras,
#     adjust the `pip install` line below to match `mkdocs.yml`'s declared
#     theme. The workflow deliberately does not `pip install .[docs]` because
#     no `docs` extra is declared in pyproject today.
#   - `mkdocs build --strict` is used so broken cross-links fail the build
#     rather than rendering as silent warnings.

name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # Only one Pages deploy in flight at a time; queue subsequent ones.
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write   # required by actions/deploy-pages

    # `environment` is a JOB key. On a step it is invalid YAML placement and the
    # workflow fails to start at all — the run reported failure with zero jobs.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # The token is not needed after checkout and would otherwise sit in the
          # git config, where a later step could publish it with an artifact.
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          version: "latest"
          # This job publishes to Pages, so a cache restored here could carry a
          # poisoned entry into the deployed site.
          enable-cache: false

      - name: Install mkdocs
        run: |
          uv pip install --system mkdocs mkdocs-material

      - name: Build site
        run: |
          mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
