# Run the unit suite on every push and every pull request.
#
# The suite was previously only ever run by hand: no workflow and no
# pre-commit hook executed it, so regressions reached main unnoticed — the
# zvec SIGILL that made the whole suite uncollectable (exit 132) was invisible
# to CI, and eight environment-dependent failures sat in the suite for months.
# This job is the durable fix: the suite runs on every change, so a failing
# test is a signal instead of a surprise.
#
# What it runs:
#   - the unit tier (tests/unit) — no network, no real LLM calls
#   - the same command the project's verification tiers document
#     (tests/AGENTS.md), so CI and humans run the same thing
#
# What it deliberately does not run:
#   - the integration tier, which downloads corpora and may reach a real
#     model; it belongs to a release-gate decision, not to every push
#   - the optional extras (ocr, mineru, pdf-full, rerank): they pull model
#     weights and native wheels that no unit test needs

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch at a time; a newer push supersedes an older one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
        with:
          version: "latest"

      - name: Install dependencies
        # `uv.lock` is gitignored, so there is no committed lock file to pin:
        # `uv sync` resolves the dependency set from pyproject.toml. The
        # project plus its dev group is all the unit tier needs, plus the
        # 'rerank' extra — the flashrank backend is an optional dependency
        # the unit tier exercises, and CI is where its real import gets
        # covered.
        # `--python 3.13` pins the interpreter to the one setup-python put on
        # PATH: uv would otherwise pick its own default, and several
        # dependencies (unrar2-cffi) ship cp313 wheels only, so a different
        # minor version means building them from source.
        run: uv sync --python 3.13 --extra rerank

      - name: Unit suite
        # The documented T2 command (tests/AGENTS.md): the retry backoff is
        # zeroed so a retry path under test does not really sleep, and the
        # plugin autoload is disabled to skip the ~6 s/proc autoload tax.
        env:
          KOMP_LLM_TRANSIENT_BACKOFF: "0"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >
          uv run pytest tests/unit -q --no-header --tb=short
          -p pytest_asyncio.plugin -p pytest_timeout
          --durations=10
