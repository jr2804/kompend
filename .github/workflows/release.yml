# Auto-tag, build, and release every push to main.
#
# Creates a calendar version tag (YYYY.M.N) and publishes to PyPI via
# trusted publishing (OIDC, no API token) and a GitHub release with the
# built wheel + sdist + LLM-generated release notes.
#
# Calver scheme (preserved verbatim from .forgejo/workflows/release.yml so
# tag numbering continues unbroken across the move):
#   - format: YYYY.M.N   (e.g. 2026.10.3)
#   - N is always present, starts at 1, resets each month
#   - N is derived from the highest existing tag matching the current YYYY.M.
#     If no tag exists for the current YYYY.M., the next release is YYYY.M.1.
#   - the head commit message is checked for the literal string "[skip release]"
#     to allow non-functional pushes (beads-sync, docs, etc.) to land without
#     spinning a new calver tag.
#
# Prerequisites (one-time setup, done by the repository owner on GitHub):
#   1. Enable GitHub Pages from "GitHub Actions" source (Settings -> Pages).
#   2. Register a PyPI "pending publisher" at https://pypi.org/manage/account/publishing/
#      with these EXACT values:
#        owner:          jr2804
#        repository:     kompend
#        workflow filename: release.yml
#        environment:    (leave blank)
#   3. (Optional) For LLM release notes, set a repository VARIABLE
#      OPENROUTER_MODEL (e.g. openrouter/free) and a repository secret
#      OPENROUTER_API_KEY. There is deliberately no built-in default model:
#      leaving the variable unset keeps the step off, and the release body is
#      then the deterministic commit list.
#   4. Mirror the existing git history (including tags) to GitHub BEFORE the
#      first run, otherwise the calver counter restarts at 1 instead of
#      continuing the last Forgejo-era tag. `git push origin --all --tags`
#      on the first push is enough.
#
# This job is the only thing that needs `id-token: write` and `contents: write`.
# The publish step uses PyPI trusted publishing, so there is no PYPI_API_TOKEN
# secret and no long-lived credential in the repository.

name: Tag and Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write   # create and push the tag
      id-token: write   # PyPI trusted publishing (OIDC)

    steps:
      # --- Checkout with full history so the calver step can inspect tags ---
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Compute next calver version (YYYY.M.N) ---
      #   N is always present, starts at 1, resets each month.
      - name: Compute next version
        id: version
        run: |
          ym=$(date +%Y.%-m)

          max_n=$(
            git tag -l "${ym}.*" \
              | sed "s/^${ym}\.//" \
              | sort -n \
              | tail -1
          )

          next_n=$(( ${max_n:-0} + 1 ))
          echo "version=${ym}.${next_n}" >> "$GITHUB_OUTPUT"

          echo "Computed: $(grep ^version= "$GITHUB_OUTPUT" | cut -d= -f2)"

      # --- Python toolchain + uv (the build backend) ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # --- Create and push the tag ---
      - name: Create and push tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "kompend-release-bot"
          git config user.email "bot@kompend.local"

          ver="${{ steps.version.outputs.version }}"

          git tag -a "$ver" -m "Release $ver"
          # `persist-credentials: false` on the checkout keeps the token out of the
          # origin URL, which is the point — so the push authenticates explicitly
          # instead. Without this it fails with
          # "could not read Username for 'https://github.com'".
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$ver"

      # --- Build wheel + sdist ---
      - name: Build
        run: |
          uv build

      # --- Publish to PyPI via trusted publishing (OIDC) ---
      #   No API token. The PyPI pending publisher must be registered with
      #   workflow filename "release.yml" and the same owner/repo.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # skip-existing: true  # intentionally NOT set — a duplicate-version
          # publish is a real error and should fail the job.

      # --- Generate release notes (LLM-summarised, deterministic fallback) ---
      #   Cosmetic only. The deterministic commit list is written FIRST, so a
      #   missing key, an unreachable API or a bad summary can never block the
      #   release; a successful summary overwrites it. `continue-on-error` keeps
      #   the job, and the release that follows it, intact if the call fails.
      #
      #   Configured entirely by the operator, with NO built-in default model:
      #     secret   OPENROUTER_API_KEY  - the credential
      #     variable OPENROUTER_MODEL    - model id to call (e.g. openrouter/free)
      #   An unset variable means "keep this step off", not "pick a model for me".
      - name: Generate release notes
        id: notes
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          set -euo pipefail
          ver="${{ steps.version.outputs.version }}"

          # Commits since the previous release tag (last 10 on a first release).
          last_tag=$(git tag -l --sort=-version:refname | head -2 | tail -1 || true)
          if [ -n "$last_tag" ]; then
            range="${last_tag}..HEAD"
          else
            range="HEAD"
          fi
          git log "$range" --oneline --no-decorate | head -n 120 > /tmp/commits.txt

          # Deterministic body first, so the release body always exists.
          {
            printf '## kompend %s\n\n### Changes since previous release\n\n<details><summary>Commit list</summary>\n\n```\n' "$ver"
            cat /tmp/commits.txt
            printf '```\n\n</details>\n'
          } > /tmp/release-body.md

          if [ -z "${OPENROUTER_MODEL:-}" ]; then
            echo "::notice::OPENROUTER_MODEL unset; release notes are the commit list"
            exit 0
          fi
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::notice::OPENROUTER_MODEL is set but OPENROUTER_API_KEY is not; release notes are the commit list"
            exit 0
          fi

          {
            printf 'Write concise, user-facing release notes as Markdown for the\n'
            printf 'Python package kompend, which compiles a document corpus into an\n'
            printf 'interlinked, OKF-conformant markdown wiki.\n'
            printf 'Rules: use ONLY facts from the commit list below - never invent\n'
            printf 'features, numbers or issue references; group under short Markdown\n'
            printf 'headings (Features, Fixes, Documentation, Maintenance); prefix each\n'
            printf 'bullet with its scope in parentheses, e.g. (parsers), (cli); no\n'
            printf 'preamble, no closing remark, no praise. Begin with the heading\n'
            printf '"## kompend %s".\n' "$ver"
            printf 'Commit list:\n'
            cat /tmp/commits.txt
          } > /tmp/prompt.txt

          python3 - <<'PY' > /tmp/ai-notes.md
          import json, os, urllib.error, urllib.request

          request = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=json.dumps({
                  "model": os.environ["OPENROUTER_MODEL"],
                  "messages": [{"role": "user", "content": open("/tmp/prompt.txt", encoding="utf-8").read()}],
              }).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              # Surface the API's own message (bad model slug, key limit, ...);
              # a bare "HTTP Error 404" is undiagnosable in the job log.
              detail = exc.read().decode("utf-8", "replace")[:500]
              raise SystemExit(f"OpenRouter returned {exc.code}: {detail}") from exc
          print(payload["choices"][0]["message"]["content"])
          PY

          if [ -s /tmp/ai-notes.md ]; then
            {
              cat /tmp/ai-notes.md
              printf '\n<details><summary>Full commit list</summary>\n\n```\n'
              cat /tmp/commits.txt
              printf '```\n\n</details>\n'
            } > /tmp/release-body.md
          else
            echo "::warning::OpenRouter returned an empty summary; keeping the commit list"
          fi

          rm -f /tmp/commits.txt /tmp/prompt.txt

      # --- Create GitHub release and attach build artifacts ---
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: /tmp/release-body.md
          files: |
            dist/kompend-*.whl
            dist/kompend-*.tar.gz
          fail_on_unmatched_files: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
