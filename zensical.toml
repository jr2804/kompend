[project]
site_name = "KNOX"
site_description = "A compiled LLM-wiki system for scientific and technical documents. Parse, chunk, resolve, and compile PDFs, DOCX files, spreadsheets, and web sources into an interlinked, queryable knowledge base."
site_author = "Jan Reimes"
copyright = "Copyright &copy; 2026 Jan Reimes — MIT License"
repo_url = "https://codeberg.org/jr2804/knox"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "guides/cli.md" },
  { "Concepts" = "concepts/basic-principles.md" },
  { "Architecture" = "architecture/index.md" },
  { "Guides" = [
    { "CLI" = "guides/cli.md" },
    { "Compilation" = "guides/compilation.md" },
    { "Lint" = "guides/lint.md" },
    { "LLM Config" = "guides/llm-config.md" },
    { "Output" = "guides/output.md" },
    { "Provenance" = "guides/provenance.md" },
    { "Review" = "guides/review.md" },
    { "Trust" = "guides/trust.md" },
    { "Wiki Structure" = "guides/wiki-structure.md" },
  ] },
  { "Reference" = [
    { "Ecosystem" = "reference/ecosystem.md" },
  ] },
  { "Integrations" = [
    { "Open WebUI" = "integrations/open-webui.md" },
  ] },
  { "About" = [
    { "Status" = "about/status.md" },
    { "Roadmap" = "about/roadmap.md" },
    { "Acknowledgements" = "about/acknowledgements.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

