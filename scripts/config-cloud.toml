# config-cloud.toml — Cloud LLM via Ollama Cloud (~1M context)
#
# Uses the ollama-cloud provider (https://ollama.com) registered by
# Knox at startup. Set OLLAMA_API_KEY in your environment.
#
# Usage:
#   .\scripts\build-wiki.ps1 scripts\config-cloud.toml

# ── LLM settings ────────────────────────────────────────────────────────
[compile.llm]
#default_model      = "ollama-cloud/deepseek-v4-flash"
default_model      = "ollama-cloud/qwen3.5"
#default_model      = "opencode-zen/deepseek-v4-flash-free"
#default_model      = "opencode-zen/gpt-5.4-nano"
#default_model      = "openrouter/openrouter/free"
#default_model      = "claudin-io/claudinio"
#api_key            = "$CLAUDINIO_API_KEY"
vlm_model          = "ollama/glm-ocr"
timeout            = 300.0
#context_window_cap = 1048576   # ~1M ctx; cloud API has no /api/show

fallback_max_retries = 3

# ── Embedding ───────────────────────────────────────────────────────────
[compile.embedding]
model = "litellm:ollama/granite-embedding:278m"
dim = 768

# ── Output ──────────────────────────────────────────────────────────────
[compile.output]
flavor = "obsidian"
max_related_links = 15

# ── Paths ───────────────────────────────────────────────────────────────
[paths]
sources_dir = "sources"
output_dir  = "wiki"
cache_dir   = ".knox/cache"
state_dir   = ".knox"

# ── Budget (cloud model has huge context, relax safety rails) ────────────
[compile.budget]
chunk_size_max     = 524288     # up to 512K chars for ~1M ctx cloud model
extract_output_max = 16384
gen_output_max     = 32768
lint_output_max    = 16384

# ── Lint (all structural rules enabled for demo) ───────────────────────
[lint]
enabled = [
    "broken-wikilinks",
    "missing-frontmatter",
    "orphan-page",
    "duplicate-title",
    "empty-page",
    "heading-skip",
    "stale-page",
    "source-not-found",
]

# ── Search / RAG enhancements (optional plug-in steps) ─────────────────
[search]
expansion.enabled = true
expansion.variants = 3
crag.enabled = true
crag.threshold = 0.3
reranker.enabled = true
reranker.model = "cross-encoder/ms-marco-MiniLM-L-6-v2"
reranker.top_k = 20
hyde.enabled = true
contextual.enabled = true
contextual.model = ""

# ── Dedup (content-level duplicate detection) ────────────────────────────
[dedup]
enabled = true
matchers = "embedding,minhash"
threshold_identical = 0.95
threshold_similar = 0.80
# model = ""
minhash_lsh_threshold = 0.8
