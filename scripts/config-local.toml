# config-local.toml — Local LLM with 128K context window
#
# Uses ollama/lfm2.5 running locally. Context window is discovered
# automatically at ~128K tokens. Embedding from local granite-embedding.
#
# Usage:
#   .\scripts\build-wiki.ps1 scripts\config-local.toml

# ── Build metadata (used by build-wiki.ps1) ─────────────────────────────
[build]
output_name = "demo-wiki-local"

# ── LLM settings ────────────────────────────────────────────────────────
[compile.llm]
#default_model = "ollama/lfm2.5"
#default_model = "ollama/hf.co/empero-ai/Qwythos-9B-Claude-Mythos-5-1M-GGUF:Q4_K_M "
default_model = "ollama/gemma4:e4b"
vlm_model     = "ollama/glm-ocr"
# context_window_cap = # optional; if not set, build-wiki.ps1 will call /api/show
timeout = 600.0

fallback_max_retries = 2

# ── Embedding ───────────────────────────────────────────────────────────
[compile.embedding]
model = "litellm:ollama/granite-embedding:278m"
dim = 768

# ── Output ──────────────────────────────────────────────────────────────
[compile.output]
flavor = "obsidian"
max_related_links = 15

# ── Paths ───────────────────────────────────────────────────────────────
[paths]
sources_dir = "sources"
output_dir = "wiki"
cache_dir = ".knox/cache"
state_dir = ".knox"

# ── Budget (128K ctx — stricter ceilings) ───────────────────────────────
[compile.budget]
chunk_size_max = 131072          # full 128K ctx
extract_output_max = 8192
gen_output_max = 16384
lint_output_max = 8192

# ── Dedup (content-level duplicate detection) ────────────────────────────
[dedup]
enabled = true
matchers = "embedding,minhash"
threshold_identical = 0.95
threshold_similar = 0.80
# model = ""
minhash_lsh_threshold = 0.8
