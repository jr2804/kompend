# config-local.toml — Local LLM
#
# Uses ollama/gemma4:e4b running locally. Context window auto-discovered.
# Embedding from local granite-embedding.
#
# Usage:
#   .\scripts\build-wiki.ps1 scripts\config-local.toml

# ── Paths ───────────────────────────────────────────────────────────────
# All paths are relative to the wiki root (directory containing
# `.knox/config.toml` or `knox.toml`, or the value of `--wiki-dir`).
[paths]
# Root directory for resolving all relative paths. When unset, uses
# the directory containing this config file, or the value of --wiki-dir.
# wiki_dir = "."
sources_dir = "sources"
output_dir = "wiki"
cache_dir = ".knox/cache"
state_dir = ".knox"

# ── Ingestion ────────────────────────────────────────────────────────────
# Backend(s) for parsing sources. A single name ("docling") or a
# comma-separated priority list — first backend supporting a file's
# format wins. "liteparse,docling" = fast liteparse for PDF/office,
# docling for HTML/EPUB/TEX/MD/CSV it doesn't handle, pandoc (auto)
# for legacy text formats. Run `knox doctor` to list available backends.
# CLI: --parser | Env: KNOX_INGEST_PARSER

[ingest]
parser = "liteparse,docling"

# ── LLM settings ────────────────────────────────────────────────────────
[compile.llm]
# Primary model in litellm format ("provider/model")
# some local models to try with 8 GB VRAM (or more):
#default_model = "ollama/lfm2.5"
default_model = "ollama/hf.co/unsloth/Qwen3.5-4B-GGUF:Q4_0"
#default_model = "ollama/hf.co/empero-ai/Qwythos-9B-Claude-Mythos-5-1M-GGUF:Q4_K_M "
#default_model = "ollama/gemma4:e4b"

# Vision model for captioning IMAGE chunks during resolution.
# When set, VLMEnricher is added to the resolver chain.
vlm_model     = "ollama/hf.co/LiquidAI/LFM2-VL-1.6B-GGUF:Q4_0"
#vlm_model     = "ollama/glm-ocr"

# User-configured cap on discovered context window (tokens).
# None = no cap (use full discovered window).
context_window_cap = 64000   # optional cap; auto-discovered from model by default

# Transient-error retries before advancing to next fallback model
fallback_max_retries = 2

# LLM communication data format: json (default) | toon | ison
# Compact formats reduce input token count by 30-70%
# data_format = "json"

# LLM call timeout
timeout = 600.0

# ── Embedding ───────────────────────────────────────────────────────────
[compile.embedding]
# Embedding model for semantic search / RAG.
# Two options:
#   "litellm:<model>" — routes through LiteLLM (OpenAI, Azure, Ollama, etc.)
#   "<model>" (no prefix) — loads a sentence-transformers model from HuggingFace
# Leave commented to disable vector indexing.
model = "litellm:ollama/granite-embedding:278m"

# ── Output ──────────────────────────────────────────────────────────────
[compile.output]
# Markdown flavor: obsidian | gfm | mkdocs | mdx | quarto | myst | standard
# Set to auto-detect when omitted.
flavor = "obsidian"
# Max related-links per page in vault mode (0 = unlimited)
max_related_links = 15

# ── Query settings ───────────────────────────────────────────────────────
[query]
# Default output format for `knox query`. Override per-run with --format.
# text = human-readable prose (default)
# json = structured {answer, citations}, pretty-printed
# toon / ison = compact structured encodings for LLM/agent consumers
#   (30-70% fewer tokens than json)
# format = "text"

# ── Compile settings ────────────────────────────────────────────────────
[compile]
# Output format: markdown | json | typst
format = "markdown"

# Compiler backend: graph (two-phase extract-then-generate) | wicer (iterative compile-evaluate-refine)
compiler = "wicer"

# Image handling: file (extract to disk) | base64 (inline)
image_mode = "file"
# VLM pre-filter thresholds (bytes / pixels)
# vlm_min_image_bytes = 2048
# vlm_min_image_dimension = 64
# in_place_sources = false
# page_kind = "concept"

# ── Budget (128K ctx — stricter ceilings) ───────────────────────────────
[compile.budget]
concepts_per_batch = 4
verify_min_ngram = 3
wicer_max_iterations = 3
min_content_length = 50
min_concept_sources = 2
max_concept_pages = 50
chunk_size_min = 2048
chunk_size_max = 131072          # full 128K ctx
extract_output_max = 16384
gen_output_max = 32768
verify_output_max = 4096
lint_output_max = 16384
summary_max_content_chars = 8000
summary_target_chars = 600

# ── Lint (all structural rules enabled for demo) ───────────────────────
[lint]
# Rules to run (null = all structural rules)
enabled = [
    "broken-wikilinks",
    "missing-frontmatter",
    "orphan-page",
    "duplicate-title",
    "empty-page",
    "heading-skip",
    "stale-page",
    "source-not-found",
]

# ── Trust settings ──────────────────────────────────────────────────────
[trust]
# user_tracking = true

# ── Dedup (content-level duplicate detection) ────────────────────────────
[dedup]
# Enable duplicate detection during ingestion
enabled = true
# Matcher backends: embedding, minhash, or both
matchers = "embedding,minhash"
# Similarity threshold for treating documents as near-identical
threshold_identical = 0.95
# Similarity threshold for flagging documents as similar
threshold_similar = 0.80
# Embedding model override; empty string falls back to compile.embedding.model
# model = ""
# MinHash LSH threshold used by the minhash matcher
minhash_lsh_threshold = 0.8

# ── Search / RAG enhancements (optional plug-in steps) ─────────────────
# Enhanced retrieval pipeline features. All default to disabled.
# Each is an optional plug-in step — enable only what you need.
[search]
# Multi-query expansion (RAG-Fusion): generate N query variants via LLM,
# retrieve independently for each, then merge via RRF.
expansion.enabled = true
expansion.variants = 3

# CRAG (Corrective RAG): LLM grades each retrieved chunk for relevance.
# Chunks below threshold are dropped before synthesis.
crag.enabled = true
crag.threshold = 0.3

# Neural re-ranker: cross-encoder re-ranks top-K candidates by true
# query-passage relevance. Requires sentence-transformers.
reranker.enabled = true
reranker.model = "cross-encoder/ms-marco-MiniLM-L-6-v2"
reranker.top_k = 20

# HyDE (Hypothetical Document Embeddings): for sparse queries, generate
# a hypothetical answer first, then use its embedding for retrieval.
hyde.enabled = true

# Contextual Retrieval: during T2 chunking, prepend situating context
# to each chunk before embedding. Improves both compilation and query.
contextual.enabled = true
contextual.model = ""

# Synthesis verbosity: brief | standard | comprehensive (override per-run
# with `knox query --verbosity`). Token budgets are clamped to the model's
# max_output.
synthesis.verbosity = "standard"
synthesis.tokens.brief = 300
synthesis.tokens.standard = 800
synthesis.tokens.comprehensive = 2000
