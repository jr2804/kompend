# config-local.toml — Local LLM demo overlay
#
# Only values that differ from DEFAULTS. Everything else is filled in
# automatically by the config system (see knox.toml.example for full docs).
#
# Required env vars: KNOX_LOCAL_LLM, KNOX_LOCAL_VLM, KNOX_LOCAL_EMBEDDING
# Optional env vars: KNOX_LOCAL_CTX_CAP (caps context window + chunk size)
#
# Usage: .\scripts\build-wiki.ps1 scripts\config-local.toml

[ingest]
parser = "web,liteparse,docling,pandoc"

[compile]
compiler = "wicer"

[compile.llm]
default_model = "${KNOX_LOCAL_LLM}"
vlm_model = "${KNOX_LOCAL_VLM}"
data_format = "ison"
timeout = 600.0
output_retries = 4
reasoning_effort = "none"
# Cap discovered context window (tokens). Set KNOX_LOCAL_CTX_CAP env var
# to enable. When unset, auto-discovers from the model.
context_window_cap = "${KNOX_LOCAL_CTX_CAP}"

[compile.embedding]
model = "${KNOX_LOCAL_EMBEDDING}"

[compile.output]
flavor = "obsidian"

[compile.budget]
wicer_max_iterations = 2
concepts_per_batch = 1
extract_output_max = 16384
gen_output_max = 32768
lint_output_max = 16384
# chunk_size_max is left at its default (131072). The chunker already clamps
# the effective chunk size to the discovered context window
# (clamp(context_window - reserve, chunk_size_min, chunk_size_max)), so there
# is no need to mirror KNOX_LOCAL_CTX_CAP here. Setting it to the env-var
# interpolation string would inject a string into an int field.

[lint]
enabled = [
    "broken-wikilinks",
    "missing-frontmatter",
    "orphan-page",
    "duplicate-title",
    "empty-page",
    "heading-skip",
    "stale-page",
    "source-not-found",
]

[dedup]
enabled = true

[search]
expansion.enabled = true
crag.enabled = true
reranker.enabled = true
hyde.enabled = true
contextual.enabled = true
