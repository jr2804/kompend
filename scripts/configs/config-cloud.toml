# config-cloud.toml — Cloud LLM demo overlay
#
# Only values that differ from DEFAULTS. Everything else is filled in
# automatically by the config system (see knox.toml.example for full docs).
#
# Required env vars: KNOX_CLOUD_LLM, KNOX_CLOUD_VLM, KNOX_CLOUD_EMBEDDING
# Optional env vars: KNOX_CLOUD_CTX_CAP (caps context window + chunk size)
#
# Usage: .\scripts\build-wiki.ps1 scripts\config-cloud.toml

[compile]
compiler = "wicer"

[compile.llm]
default_model = "${KNOX_CLOUD_LLM}"
vlm_model = "${KNOX_CLOUD_VLM}"
data_format = "ison"
timeout = 300.0
fallback_max_retries = 3
reasoning_effort = "low"
# Cap the context window (tokens) for every model. Set KNOX_CLOUD_CTX_CAP to
# enable; when unset it auto-discovers from the model.
# context_window = "${KNOX_CLOUD_CTX_CAP}"

[compile.embedding]
model = "${KNOX_CLOUD_EMBEDDING}"

[compile.output]
flavor = "obsidian"

[compile.budget]
extract_output_max = 16384
gen_output_max = 32768
lint_output_max = 16384
# chunk_size_max is left at its default (131072). The chunker already clamps
# the effective chunk size to the discovered context window
# (clamp(context_window - reserve, chunk_size_min, chunk_size_max)), so there
# is no need to mirror KNOX_*_CTX_CAP here.

[lint]
enabled = [
    "broken-wikilinks",
    "missing-frontmatter",
    "orphan-page",
    "duplicate-title",
    "empty-page",
    "heading-skip",
    "stale-page",
    "source-not-found",
]

[dedup]
enabled = true

[search]
expansion.enabled = true
crag.enabled = true
reranker.enabled = true
hyde.enabled = true
contextual.enabled = true
