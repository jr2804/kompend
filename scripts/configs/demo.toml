# demo.toml — the shared demo profile for scripts/build/build-wiki.ps1
#
# One file for both demo profiles (local small models vs. hosted models).
# Everything that differs between the profiles is an env var, because the
# env layer outranks the project config:
#
#   KOMP_LLM_DEFAULT_MODEL            compile.llm.default_model
#   KOMP_VLM_MODEL                    compile.llm.vlm_model
#   KOMP_EMBEDDING_MODEL              compile.embedding.model
#   KOMP_LLM_TIMEOUT                  compile.llm.timeout
#   KOMP_LLM_OUTPUT_RETRIES           compile.llm.output_retries
#   KOMP_LLM_REASONING_EFFORT         compile.llm.reasoning_effort
#   KOMP_LLM_CONTEXT_WINDOW           compile.llm.context_window
#   KOMP_BUDGET_WICER_MAX_ITERATIONS  compile.budget.wicer_max_iterations
#
# The build script sets them per profile; set them yourself to run a
# profile by hand:
#
#   $env:KOMP_LLM_DEFAULT_MODEL = "ollama/hf.co/google/gemma-4-E4B-it-qat-q4_0-gguf:latest"
#   $env:KOMP_EMBEDDING_MODEL   = "ollama/granite-embedding:278m"
#   $env:KOMP_LLM_CONTEXT_WINDOW = "160000"
#   uv run kompend init ./my-vault --seed-config scripts/configs/demo.toml
#
# No ${VAR} placeholders here on purpose: an unset env var leaves the
# placeholder text in the value, and a string where an int belongs is a
# config error ("Input should be a valid integer").
#
# Only values that differ from the schema defaults are listed. Everything
# else comes from the defaults — see kompend.toml.example for the full
# reference of every key.

[ingest]
# The parse tier, tuned for the demo corpus (15 native-text PDFs + 6 URLs,
# 123 PDF pages - every page carries a text layer).
#
# parsecraft_judge / parsecraft_judge_model - a live System One judge
# re-ranks, per page, the backends the hard constraints already admitted.
# Measured on the 34-page paper in the corpus
# (tests/data/sources/dnn_speech_intelligibility_2022.pdf):
#
#   judge "none" -> liteparse   1.5s  147 elements  4 headings, no tables
#   judge tev1   -> docling  59-90s  215 elements  22 headings, 53 list
#                                               items, 4 tables with cells
#
# The judge model must be a Tev/Nimble GGUF (the ollama System One endpoint
# rejects anything else with HTTP 400) and must be reachable under its BARE
# name: "tev1" resolves to "tev1:latest". The build script aliases the tag
# when only "tev1:0.8b" is installed.
parsecraft_judge = "ollama"
parsecraft_judge_model = "tev1"

# Prefer the strongest eligible backend over the cheapest one.
parsecraft_preference = "quality"

# Recover table structure from a page's vector graphics - a vector table
# arrives as a structured list[list[str]] instead of a Markdown grid.
parsecraft_extract_vector_graphics = true

# No OCR: every page of the demo corpus has a text layer, and this host has
# no usable OCR backend (no CUDA torch build, no tesseract). Without this the
# installed "ocr" extra would let the planner route a page to a GPU VLM that
# cannot run here.
parsecraft_allow_ocr = false

[compile]
# The iterative compiler. The default ("graph") compiles in one pass;
# "wicer" refines each concept over several passes.
compiler = "wicer"

[compile.llm]
# Structured output format for the LLM tier.
data_format = "ison"

[compile.output]
# Obsidian-flavoured wikilinks and frontmatter.
flavor = "obsidian"

[lint]
enabled = [
    "broken-wikilinks",
    "missing-frontmatter",
    "orphan-page",
    "duplicate-title",
    "empty-page",
    "heading-skip",
    "stale-page",
    "source-not-found",
]

[dedup]
enabled = true

[search]
expansion.enabled = true
crag.enabled = true
reranker.enabled = true
hyde.enabled = true
contextual.enabled = true
