# Pre-commit hooks configuration for My Project
#
# Install pre-commit hooks:
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: [--check-filenames]
        exclude: ^(tests/|\.git|\.tox|.*\.min\.js|.*\.min\.css)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-field-consistency
        name: check field consistency (no bare-string contract keys)
        entry: uv run python scripts/check_field_consistency.py
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit, manual]
      - id: check-antipatterns
        name: check antipatterns (no magic crops, banned noqa, etc.)
        entry: uv run python scripts/check_antipatterns.py
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit, manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
